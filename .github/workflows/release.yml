name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # The tag name reaches the shell only via the GITHUB_REF_NAME env var, and the script validates it.
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $prerelease
